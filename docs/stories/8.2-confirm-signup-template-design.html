<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm your TodoTomorrow account</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.6; color: #333; background-color: #FFFFFF;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width: 100%; border-collapse: collapse; background-color: #FFFFFF;">
    <tr>
      <td style="padding: 0;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 600px; margin: 0 auto; border-collapse: collapse;">
          <!-- Header Section -->
          <tr>
            <td style="padding: 20px; text-align: left;">
              <h2 style="margin: 0; font-size: 20px; font-weight: 600; color: #333;">Welcome to TodoTomorrow!</h2>
            </td>
          </tr>
          
          <!-- Content Section -->
          <tr>
            <td style="padding: 0 20px 20px 20px;">
              <p style="margin: 0 0 20px 0; color: #666; font-size: 14px; line-height: 1.6;">Click the button below to confirm your email and complete your signup:</p>
              
              <!-- Confirmation Button -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width: 100%; margin: 0 0 20px 0;">
                <tr>
                  <td style="text-align: center; padding: 0;">
                    <a href="{{ .ConfirmationURL }}" style="display: inline-block; padding: 12px 24px; background-color: #007AFF; color: #FFFFFF; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 16px;">Confirm Your Email</a>
                  </td>
                </tr>
              </table>
              
              <p style="margin: 0; color: #999; font-size: 12px; line-height: 1.6;">If the button doesn't work, copy and paste this link into your browser:</p>
              <p style="margin: 10px 0 0 0; color: #666; font-size: 12px; line-height: 1.6; word-break: break-all;">{{ .ConfirmationURL }}</p>
            </td>
          </tr>
          
          <!-- Footer Section -->
          <tr>
            <td style="padding: 20px; text-align: center; border-top: 1px solid #eee;">
              <p style="margin: 0; font-size: 12px; color: #999;">TodoTomorrow - Your daily task companion</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
